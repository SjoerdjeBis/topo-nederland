<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf6ee">
<title>Topo Nederland - Oefenen</title>
<link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: 'Fraunces';
    font-style: normal;
    font-weight: 500 900;
    font-display: swap;
    src: url(fonts/fraunces-latin.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Nunito';
    font-style: normal;
    font-weight: 500 900;
    font-display: swap;
    src: url(fonts/nunito-latin.woff2) format('woff2');
  }
  :root {
    --fern:          #4a7c59;
    --fern-dark:     #2d4a35;
    --fern-light:    #6b9b78;
    --marigold:      #f9a620;
    --marigold-dark: #d6850a;
    --terracotta:    #b7472a;
    --terracotta-dk: #8e3520;
    --teal:          #3a6b6e;
    --teal-dark:     #234447;
    --cream:         #f5f3ed;
    --cream-warm:    #faf6ee;
    --cream-soft:    #ebe5d4;
    --ink:           #2c1e0f;
    --ink-soft:      #5c4a39;
    --sea:           #c9e3ec;
    --ease-out:      cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out:   cubic-bezier(0.77, 0, 0.175, 1);
    --ease-spring:   cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background:
      radial-gradient(ellipse at top left, #fff8e8 0%, transparent 50%),
      radial-gradient(ellipse at bottom right, #ffe0c8 0%, transparent 55%),
      linear-gradient(180deg, var(--cream-warm) 0%, var(--cream-soft) 100%);
    color: var(--ink);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #app {
    max-width: 1280px;
    margin: 0 auto;
    /* Respect notch/status bar bovenaan en navigatiebalk onderaan op mobiel */
    padding:
      max(12px, env(safe-area-inset-top))
      max(20px, env(safe-area-inset-right))
      max(12px, env(safe-area-inset-bottom))
      max(20px, env(safe-area-inset-left));
    /* 100dvh krimpt mee met de browser-UI op mobiel; 100vh is daar vaak te hoog */
    height: 100vh;
    height: 100svh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  h1 {
    font-family: 'Fraunces', 'Georgia', serif;
    font-weight: 900;
    font-variation-settings: 'opsz' 144;
    text-align: center;
    color: var(--terracotta);
    margin: 6px 0 12px;
    font-size: 2.1em;
    letter-spacing: -0.02em;
    line-height: 1;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.6);
  }
  h2 { font-family: 'Fraunces', serif; color: var(--fern-dark); font-weight: 800; margin-top: 0; }

  /* ============ MENU ============ */
  #menu { text-align: center; padding: 6px; flex: 1; overflow-y: auto; }
  .menu-intro {
    font-size: 1.05em; font-weight: 700;
    color: var(--ink-soft); margin: 4px 0;
    font-family: 'Fraunces', serif; font-style: italic;
  }
  .style-toggle {
    position: relative;
    display: inline-flex; gap: 4px; padding: 4px;
    margin: 10px auto 0;
    background: white; border-radius: 100px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  }
  .style-toggle button {
    position: relative; z-index: 1;
    font-family: 'Nunito', sans-serif; font-size: 0.95em; font-weight: 800;
    border: none; border-radius: 100px; cursor: pointer;
    padding: 9px 16px; color: var(--ink-soft); background: transparent;
    transition: color 200ms ease, transform 160ms var(--ease-out);
  }
  .style-toggle button:active { transform: scale(0.96); }
  .style-toggle button { white-space: nowrap; }
  .style-toggle .short { display: none; }
  @media (max-width: 440px) {
    .style-toggle .long { display: none; }
    .style-toggle .short { display: inline; }
  }
  .style-toggle button[aria-pressed="true"] { color: white; }
  .toggle-pill {
    position: absolute; top: 4px; bottom: 4px; left: 0;
    width: var(--pill-w, 0); transform: translateX(var(--pill-x, 0));
    background: linear-gradient(135deg, var(--fern-light), var(--fern));
    border-radius: 100px;
    box-shadow: 0 2px 6px rgba(45,74,53,0.3);
    transition: transform 320ms var(--ease-in-out), width 320ms var(--ease-in-out);
  }
  .style-toggle.no-anim .toggle-pill { transition: none; }
  .menu-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 16px; max-width: 720px; margin: 18px auto;
  }
  .menu-btn {
    padding: 22px 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.15em; font-weight: 800;
    border: none; border-radius: 22px;
    cursor: pointer; color: white;
    position: relative; overflow: hidden;
    letter-spacing: 0.2px;
    box-shadow:
      0 5px 0 rgba(0,0,0,0.18),
      0 10px 25px rgba(0,0,0,0.10);
    transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
  }
  .menu-btn::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 55%;
    background: linear-gradient(180deg, rgba(255,255,255,0.25), transparent);
    border-radius: 22px 22px 0 0;
    pointer-events: none;
  }
  @media (hover: hover) and (pointer: fine) {
    .menu-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 0 rgba(0,0,0,0.18), 0 14px 30px rgba(0,0,0,0.15);
    }
    .menu-btn:hover .emoji { transform: translateY(-3px) rotate(-8deg) scale(1.08); }
  }
  .menu-btn:active {
    transform: translateY(3px) scale(0.98);
    box-shadow: 0 2px 0 rgba(0,0,0,0.18), 0 4px 10px rgba(0,0,0,0.08);
    transition-duration: 100ms;
  }

  .menu-btn.prov { background: linear-gradient(135deg, #d05935, var(--terracotta) 60%, var(--terracotta-dk)); }
  .menu-btn.cap  { background: linear-gradient(135deg, #5e9670, var(--fern) 60%, var(--fern-dark)); }
  .menu-btn.riv  { background: linear-gradient(135deg, #4d878c, var(--teal) 60%, var(--teal-dark)); }
  .menu-btn.wat  { background: linear-gradient(135deg, #fbb850, var(--marigold) 60%, var(--marigold-dark)); }
  .menu-btn.mix  {
    background: linear-gradient(110deg, var(--terracotta), var(--marigold) 45%, var(--fern) 100%);
    grid-column: 1 / span 2;
  }

  .menu-btn .emoji {
    font-size: 1.7em; display: block; margin-bottom: 4px;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
    transition: transform 350ms var(--ease-spring);
  }
  .menu-btn .best {
    display: block; font-size: 0.72em; font-weight: 700;
    opacity: 0.95; margin-top: 6px; letter-spacing: 0.3px;
    min-height: 1.3em;
  }
  .stars { letter-spacing: 2px; }
  .stars .off { opacity: 0.35; }
  .reset-link {
    background: none; border: none;
    color: var(--terracotta);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer; font-size: 0.88em; font-weight: 700;
    font-family: 'Nunito', sans-serif;
    margin-top: 8px;
  }
  .reset-link:hover { color: var(--terracotta-dk); }
  .menu-help {
    color: var(--ink-soft); max-width: 560px;
    margin: 16px auto 0; font-size: 0.92em;
    line-height: 1.5; font-weight: 500;
  }
  .credits { color: var(--ink-soft); opacity: 0.7; font-size: 0.72em; margin: 14px auto 0; max-width: 560px; }

  /* ============ QUIZ ============ */
  #app.in-quiz h1 { display: none; }
  #quiz { display: none; flex-direction: column; flex: 1; min-height: 0; gap: 8px; }
  #quiz.active { display: flex; }
  .topbar {
    display: flex; align-items: center;
    gap: 8px; flex-shrink: 0;
  }
  .score, .streak {
    font-size: 0.95em; font-weight: 800;
    color: var(--ink);
    background: white;
    padding: 8px 14px;
    border-radius: 100px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    letter-spacing: 0.2px;
    white-space: nowrap;
  }
  .score .good { color: var(--fern); }
  .score .bad  { color: var(--terracotta); }
  .streak { color: var(--marigold-dark); display: none; }
  .streak.show { display: inline-block; animation: pop 380ms var(--ease-spring); }
  .bump { display: inline-block; animation: bump 320ms var(--ease-spring); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.4); } 100% { transform: scale(1); } }
  .back-btn {
    font-family: 'Nunito', sans-serif;
    background: white;
    color: var(--ink);
    border: none;
    padding: 8px 16px;
    border-radius: 100px;
    cursor: pointer;
    font-size: 0.9em; font-weight: 800;
    transition: background 200ms ease, color 200ms ease, transform 160ms var(--ease-out);
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    white-space: nowrap;
  }
  @media (hover: hover) and (pointer: fine) {
    .back-btn:hover { background: var(--terracotta); color: white; }
  }
  .back-btn:active { transform: scale(0.94); }

  .progress {
    height: 8px; border-radius: 100px; flex-shrink: 0;
    background: rgba(0,0,0,0.07); overflow: hidden;
  }
  .progress-fill {
    position: relative; overflow: hidden;
    height: 100%; width: 0%; border-radius: 100px;
    background: linear-gradient(90deg, #8fbf9b, var(--fern));
    transition: width 600ms var(--ease-out);
  }
  .progress-fill::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    transform: translateX(-100%);
  }
  .progress-fill.shine::after { animation: shine 700ms ease-out; }
  @keyframes shine { to { transform: translateX(100%); } }

  /* Staand scherm: kaart boven, vraag eronder. Liggend: naast elkaar. */
  .quiz-layout {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 10px;
  }
  .map-box { position: relative; flex: 1; min-height: 0; min-width: 0; }
  #map-container { position: absolute; inset: 0; }
  #map-container svg {
    width: 100%; height: 100%; display: block;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .question-box { flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
  @media (orientation: landscape) and (min-width: 600px) {
    .quiz-layout { flex-direction: row; gap: 24px; justify-content: center; }
    .map-box { flex: 0 1 auto; height: 100%; aspect-ratio: 685 / 805; }
    .question-box { width: clamp(280px, 34vw, 420px); justify-content: center; }
  }

  .question {
    font-family: 'Fraunces', serif;
    font-size: 1.3em; font-weight: 700;
    margin: 0; color: var(--ink);
    line-height: 1.25;
    letter-spacing: -0.01em;
    /* altijd ruimte voor twee regels, zodat de kaart niet verspringt */
    min-height: 2.5em;
    display: flex; align-items: center;
  }
  .question .target { color: var(--terracotta); }
  .q-anim { display: inline; animation: q-in 280ms var(--ease-out) both; }
  @keyframes q-in { from { opacity: 0; transform: translateY(6px); filter: blur(3px); } }

  /* Vak met vaste hoogte: eerst antwoorden of hint, daarna feedback + Volgende */
  .action-area { height: 116px; position: relative; }
  .answers {
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: 8px; height: 100%;
  }
  .answer-btn {
    position: relative;
    padding: 6px 10px;
    font-size: 1em; font-family: 'Nunito', sans-serif;
    background: white;
    border: 2px solid transparent;
    border-radius: 14px;
    cursor: pointer; text-align: center;
    font-weight: 800; color: var(--ink);
    transition: transform 160ms var(--ease-out), border-color 200ms ease, box-shadow 200ms ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07), inset 0 -3px 0 rgba(0,0,0,0.05);
    animation: item-in 260ms var(--ease-out) backwards;
  }
  .answer-btn:nth-child(2) { animation-delay: 40ms; }
  .answer-btn:nth-child(3) { animation-delay: 80ms; }
  .answer-btn:nth-child(4) { animation-delay: 120ms; }
  .answer-btn:active { transform: scale(0.96); transition-duration: 80ms; }
  @keyframes item-in { from { opacity: 0; transform: translateY(8px) scale(0.97); } }
  .answer-btn .key {
    display: none;
    position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    font-size: 0.72em; font-weight: 800; color: var(--ink-soft);
    background: var(--cream); border-radius: 6px; padding: 1px 6px; opacity: 0.8;
  }
  @media (hover: hover) and (pointer: fine) {
    .answer-btn .key { display: inline-block; }
    .answer-btn:hover { border-color: var(--fern-light); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(74,124,89,0.18), inset 0 -3px 0 rgba(0,0,0,0.05); }
    .answer-btn:hover:active { transform: scale(0.96); }
  }
  .point-hint {
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    border: 2px dashed rgba(92,74,57,0.25); border-radius: 14px;
    color: var(--ink-soft); font-weight: 800; font-size: 1em;
    animation: fade-in 250ms ease both;
  }
  .point-hint .finger { display: inline-block; margin-right: 6px; animation: tap 1.6s var(--ease-in-out) infinite; }
  @keyframes tap { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(4px) scale(0.92); } }
  .result { display: none; height: 100%; gap: 8px; }
  #quiz.point .answers, #quiz:not(.point) .point-hint,
  #quiz.answered .answers, #quiz.answered .point-hint { display: none; }
  #quiz.answered .result { display: flex; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }
  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    70% { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); }
  }
  @keyframes rise {
    from { transform: translateY(10px) scale(0.98); opacity: 0; filter: blur(2px); }
    to { transform: none; opacity: 1; filter: none; }
  }

  .feedback {
    flex: 1; min-width: 0;
    padding: 8px 12px;
    border-radius: 14px;
    font-size: 0.92em;
    line-height: 1.35;
    font-weight: 600;
    overflow-y: auto;
    display: flex; flex-direction: column; justify-content: center;
  }
  .feedback.good {
    background: linear-gradient(135deg, #e8f5ec, #d4ebd9);
    color: var(--fern-dark);
    border-left: 5px solid var(--fern);
    animation: rise 280ms var(--ease-out) both;
  }
  .feedback.bad {
    background: linear-gradient(135deg, #fbe6df, #f3d5cc);
    color: var(--terracotta-dk);
    border-left: 5px solid var(--terracotta);
    animation: rise 280ms var(--ease-out) both, shake 360ms ease 220ms;
  }
  .feedback .mark { display: inline-block; animation: pop 420ms var(--ease-spring) 80ms both; }
  .feedback .streak-note { color: var(--marigold-dark); font-weight: 800; }
  .next-btn {
    flex-shrink: 0; width: 84px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.85em; font-weight: 800;
    background: linear-gradient(135deg, var(--marigold), var(--marigold-dark));
    color: white; border: none;
    border-radius: 14px; cursor: pointer;
    box-shadow: 0 4px 0 var(--marigold-dark), 0 8px 18px rgba(249,166,32,0.30);
    margin-bottom: 4px;
    transition: transform 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
    animation: item-in 320ms var(--ease-spring) 90ms backwards;
  }
  .next-btn .arrow { font-size: 2em; line-height: 1; transition: transform 250ms var(--ease-spring); }
  @media (hover: hover) and (pointer: fine) {
    .next-btn:hover { transform: translateY(-2px); }
    .next-btn:hover .arrow { transform: translateX(4px); }
  }
  .next-btn:active { transform: translateY(3px) scale(0.97); box-shadow: 0 1px 0 var(--marigold-dark); transition-duration: 80ms; }

  .toast {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    background: var(--fern-dark); color: white; font-weight: 800; font-size: 0.9em;
    padding: 8px 14px; border-radius: 100px; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    opacity: 0; pointer-events: none;
    transform: translate(-50%, -10px) scale(0.96);
    transition: opacity 180ms ease, transform 180ms var(--ease-out);
  }
  .toast.show {
    opacity: 1; transform: translate(-50%, 0) scale(1);
    transition: opacity 250ms ease, transform 350ms var(--ease-spring);
  }

  /* Compacter op kleine schermen */
  @media (max-width: 600px) {
    #app { padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom)); }
    h1 { font-size: 1.5em; margin: 2px 0 6px; }
    .menu-btn { padding: 16px 12px; font-size: 1.05em; }
    .menu-btn .emoji { font-size: 1.4em; }
    .style-toggle button { padding: 8px 12px; font-size: 0.88em; }
    .score, .streak { padding: 7px 11px; font-size: 0.88em; }
    .back-btn { padding: 7px 13px; font-size: 1.05em; }
    .back-btn .back-text { display: none; }
    .question { font-size: 1.12em; }
    .action-area { height: 104px; }
    .answer-btn { font-size: 0.95em; border-radius: 12px; }
    .feedback { font-size: 0.84em; padding: 6px 10px; }
    .next-btn { width: 70px; }
  }
  @media (max-width: 380px) {
    .lbl { display: none; }
    .topbar { gap: 6px; }
  }
  /* Lage schermen (telefoon liggend) */
  @media (max-height: 500px) {
    #quiz { gap: 6px; }
    .back-btn .back-text { display: none; }
    .question { font-size: 1em; }
    .action-area { height: 96px; }
  }

  /* ============ KAART ============ */
  #map-container svg * { pointer-events: none; }
  .sea-bg, .inner-water { fill: var(--sea); }
  .water {
    fill: var(--sea);
    stroke: none;
    transition: fill 250ms ease, stroke 250ms ease;
  }
  .waves { fill: url(#waves); }
  .land-halo { fill: none; stroke: #e4f2f6; stroke-width: 7; stroke-linejoin: round; }
  .land-shadow { fill: rgba(92, 74, 57, 0.16); }
  .water.marsh { fill: #aed3df; stroke: #6b8e9d; stroke-width: 0.6; stroke-dasharray: 2 2; }
  .neighbor { fill: #e6e0d4; stroke: #e6e0d4; stroke-width: 3; stroke-linejoin: round; }
  .country-label {
    font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800;
    fill: #a3978a; letter-spacing: 3px;
  }
  .province {
    fill: #f5eacd;
    stroke: #a3825f;
    stroke-width: 0.7;
    stroke-linejoin: round;
    transition: fill 250ms ease, stroke 250ms ease;
  }
  .river-link {
    fill: none; stroke: var(--teal); stroke-width: 1.4; opacity: 0.4;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .river-casing {
    fill: none; stroke: #eef7f9; stroke-width: 4.6;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .river {
    fill: none;
    stroke: #4b8a8e;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 250ms ease, stroke-width 250ms var(--ease-out);
  }
  /* Stromend water: OSM-lijnen lopen stroomafwaarts, dus de streepjes stromen mee */
  .river-flow {
    fill: none; stroke: rgba(255,255,255,0.85); stroke-width: 1.6;
    stroke-linecap: round; stroke-dasharray: 2 7;
    opacity: 0; transition: opacity 250ms ease;
  }
  .river-g.highlight .river-flow, .river-g.pick-right .river-flow, .river-g.reveal .river-flow {
    opacity: 1; animation: flow 900ms linear infinite;
  }
  @keyframes flow { to { stroke-dashoffset: -9; } }
  .river-glow {
    fill: none; stroke: #fff6dc; stroke-width: 11;
    stroke-linecap: round; stroke-linejoin: round;
    opacity: 0; transition: opacity 250ms ease;
  }
  .river-g.highlight .river-glow, .river-g.pick-right .river-glow,
  .river-g.reveal .river-glow, .river-g.pick-wrong .river-glow { opacity: 0.9; }
  .river-hit { fill: none; stroke: transparent; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }

  /* Vraag: dit gebied licht op */
  .province.highlight { fill: var(--terracotta); stroke: var(--terracotta-dk); stroke-width: 1.5; }
  .river-g.highlight .river { stroke: var(--marigold-dark); stroke-width: 6; opacity: 1; }
  .water.highlight { fill: #ffd54f; stroke: #f57f17; stroke-width: 1.5; stroke-dasharray: none; }

  /* Aanwijzen: goed / fout / dit had het moeten zijn */
  .province.pick-right, .province.reveal { fill: var(--fern-light); stroke: var(--fern-dark); stroke-width: 1.5; }
  .province.pick-wrong { fill: #d9785a; stroke: var(--terracotta-dk); stroke-width: 1.5; }
  .water.pick-right, .water.reveal { fill: var(--fern-light); stroke: var(--fern-dark); stroke-width: 1.5; stroke-dasharray: none; }
  .water.pick-wrong { fill: #d9785a; stroke: var(--terracotta-dk); stroke-width: 1.5; stroke-dasharray: none; }
  .river-g.pick-right .river, .river-g.reveal .river { stroke: var(--fern); stroke-width: 6; opacity: 1; }
  .river-g.pick-wrong .river { stroke: var(--terracotta); stroke-width: 6; opacity: 1; }
  /* Effecten op de kaart: tik-rimpeling, sterretjes bij goed, ring bij 'hier is het' */
  .fx { fill: none; pointer-events: none; transform-box: fill-box; transform-origin: center; }
  .fx-ripple { stroke: white; stroke-width: 2.5; animation: ripple 420ms var(--ease-out) forwards; }
  .fx-ripple.bad { stroke: var(--terracotta); }
  .fx-ring { stroke: var(--fern); stroke-width: 3; animation: ring 1100ms var(--ease-out) 3 forwards; }
  .fx-spark { fill: var(--marigold); stroke: white; stroke-width: 0.8; animation: spark 520ms var(--ease-out) forwards; }
  @keyframes ripple { from { transform: scale(0.3); opacity: 0.9; } to { transform: scale(1.6); opacity: 0; } }
  @keyframes ring { 0% { transform: scale(0.4); opacity: 0; } 20% { opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
  @keyframes spark {
    0% { transform: translate(0, 0) scale(0.6); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }
  .province.highlight, .province.pick-right, .province.reveal, .water.highlight {
    animation: nudge 380ms var(--ease-spring);
    transform-box: fill-box; transform-origin: center;
  }
  @keyframes nudge { 0% { transform: scale(0.97); } 60% { transform: scale(1.025); } 100% { transform: scale(1); } }

  /* Aanwijzen: alleen het soort gebied van de vraag is aantikbaar */
  #map-container .pick-province .province,
  #map-container .pick-water .water,
  #map-container .pick-river .river-hit,
  #map-container .pick-city .city-hit { pointer-events: auto; cursor: pointer; }
  #map-container svg.pick-river, #map-container svg.pick-city { cursor: pointer; }
  @media (hover: hover) {
    .pick-province .province:not([class*="pick-"]):not(.reveal):hover { fill: #fbe0a6; }
    .pick-water .water:not([class*="pick-"]):not(.reveal):hover { fill: #9fd0e0; stroke: var(--teal); stroke-width: 1; }
    .pick-river .river-g:not([class*="pick-"]):not(.reveal):hover .river { stroke-width: 5; opacity: 1; }
    .pick-city .city:not([class*="pick-"]):not(.reveal):hover .city-dot { r: 8; }
  }

  .city-dot {
    fill: var(--terracotta);
    stroke: white;
    stroke-width: 1.8;
    transition: r 250ms var(--ease-spring), fill 250ms ease;
  }
  .city-hit { fill: transparent; }
  .city.highlight .city-dot { fill: var(--marigold-dark); r: 8; }
  .city.pick-right .city-dot, .city.reveal .city-dot { fill: var(--fern); r: 8; }
  .city.pick-wrong .city-dot { fill: var(--terracotta-dk); r: 8; }
  .city-label {
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    fill: var(--ink);
    font-weight: 800;
    paint-order: stroke;
    stroke: #fff;
    stroke-width: 3.5;
    stroke-linejoin: round;
  }
  #cities-group { display: none; }
  #cities-group.show-dots { display: inline; }
  #cities-group.show-dots .city-label { display: none; }
  #cities-group.show-labels .city-label { display: inline; animation: fade-in 250ms ease both; }
  @keyframes fade-in { from { opacity: 0; } }

  /* ============ RESULTATEN ============ */
  #results { display: none; padding: 30px 24px; text-align: center; flex: 1; overflow-y: auto; }
  #results h2 { font-size: 2em; margin-bottom: 8px; color: var(--fern); }
  #result-stars { font-size: 3em; letter-spacing: 6px; margin: 4px 0 8px; }
  #result-stars span { display: inline-block; animation: star-in 600ms var(--ease-spring) 250ms both; }
  #result-stars span:nth-child(2) { animation-delay: 430ms; font-size: 1.2em; }
  #result-stars span:nth-child(3) { animation-delay: 610ms; }
  #result-stars .off { opacity: 0.25; filter: grayscale(1); }
  @keyframes star-in {
    0% { opacity: 0; transform: scale(0.4) rotate(-40deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  #results > * { animation: item-in 380ms var(--ease-out) backwards; }
  #results > :nth-child(3) { animation-delay: 450ms; }
  #results > :nth-child(4) { animation-delay: 550ms; }
  #results > :nth-child(5) { animation-delay: 650ms; }
  #result-text { font-family: 'Fraunces', serif; font-size: 1.4em; font-weight: 700; color: var(--ink); }
  #result-best { color: var(--fern-dark); font-weight: 800; margin-top: 8px; font-size: 1.1em; }
  .result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }

  /* ============ CONFETTI ============ */
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
  .confetti i { position: absolute; left: 50%; top: 38%; width: 9px; height: 13px; border-radius: 2px; }
  .confetti i.round { border-radius: 50%; width: 9px; height: 9px; }

  /* ============ SCHERMOVERGANGEN ============ */
  #menu, #quiz.active, #results { animation: screen-in 320ms var(--ease-out) backwards; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(8px) scale(0.99); } }
  #menu > * { animation: item-in 420ms var(--ease-out) backwards; }
  #menu > :nth-child(2) { animation-delay: 40ms; }
  #menu .menu-grid { animation: none; }
  #menu .menu-btn { animation: item-in 420ms var(--ease-out) backwards; }
  #menu .menu-btn:nth-child(1) { animation-delay: 80ms; }
  #menu .menu-btn:nth-child(2) { animation-delay: 130ms; }
  #menu .menu-btn:nth-child(3) { animation-delay: 180ms; }
  #menu .menu-btn:nth-child(4) { animation-delay: 230ms; }
  #menu .menu-btn:nth-child(5) { animation-delay: 280ms; }
  #menu > :nth-child(n+4) { animation-delay: 320ms; }
  h1 { animation: title-in 600ms var(--ease-out) both; }
  @keyframes title-in { from { opacity: 0; transform: translateY(-6px); letter-spacing: 0.02em; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .confetti, .fx { display: none; }
    .river-g .river-flow { animation: none !important; }
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div id="app">
  <h1>Topo Nederland</h1>

  <div id="menu">
    <p class="menu-intro">Hoe wil je oefenen?</p>
    <div class="style-toggle no-anim" role="group" aria-label="Manier van oefenen">
      <span class="toggle-pill" aria-hidden="true"></span>
      <button type="button" data-style="kies" onclick="setStyle('kies')">&#9997;&#65039; <span class="long">Kies het antwoord</span><span class="short">Kiezen</span></button>
      <button type="button" data-style="wijs" onclick="setStyle('wijs')">&#128070; <span class="long">Wijs aan op de kaart</span><span class="short">Aanwijzen</span></button>
    </div>
    <div class="menu-grid">
      <button class="menu-btn prov" onclick="startQuiz('provinces')">
        <span class="emoji" aria-hidden="true">&#x1F5FA;&#xFE0F;</span>Provincies
        <span class="best" id="best-provinces"></span>
      </button>
      <button class="menu-btn cap" onclick="startQuiz('capitals')">
        <span class="emoji" aria-hidden="true">&#x1F3DB;&#xFE0F;</span>Hoofdsteden
        <span class="best" id="best-capitals"></span>
      </button>
      <button class="menu-btn riv" onclick="startQuiz('rivers')">
        <span class="emoji" aria-hidden="true">&#x1F30A;</span>Rivieren
        <span class="best" id="best-rivers"></span>
      </button>
      <button class="menu-btn wat" onclick="startQuiz('waters')">
        <span class="emoji" aria-hidden="true">&#x1F4A7;</span>Zee&#235;n &amp; meren
        <span class="best" id="best-waters"></span>
      </button>
      <button class="menu-btn mix" onclick="startQuiz('mixed')">
        <span class="emoji" aria-hidden="true">&#x1F3B2;</span>Alles door elkaar
        <span class="best" id="best-mixed"></span>
      </button>
    </div>
    <button class="reset-link" onclick="resetScores()">Beste scores wissen</button>
    <p class="menu-help" id="menu-help"></p>
    <p class="credits">Kaart: CBS/PDOK, &copy; OpenStreetMap-bijdragers, Natural Earth</p>
  </div>

  <div id="quiz">
    <div class="topbar">
      <button class="back-btn" onclick="goMenu()" aria-label="Terug naar menu">&larr;<span class="back-text"> Terug naar menu</span></button>
      <div class="score">
        <span aria-hidden="true">&#9989;</span> <span class="sr-only">Goed:</span><span class="good" id="score-good">0</span> &nbsp;
        <span aria-hidden="true">&#10060;</span> <span class="sr-only">Fout:</span><span class="bad" id="score-bad">0</span> &nbsp;
        <span aria-hidden="true">&#128203;</span> <span class="lbl">Nog: </span><span id="score-left">0</span>
      </div>
      <div class="streak" id="streak"></div>
    </div>
    <div class="progress" role="progressbar" aria-label="Voortgang" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="quiz-layout">
      <div class="map-box">
        <div id="map-container"></div>
        <div class="toast" id="toast" role="status"></div>
      </div>
      <div class="question-box">
        <div class="question"><span id="question-text"></span></div>
        <div class="action-area">
          <div class="answers" id="answers"></div>
          <div class="point-hint"><span class="finger" aria-hidden="true">&#128070;</span>Tik op de kaart</div>
          <div class="result">
            <div class="feedback" id="feedback"></div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()" aria-label="Volgende vraag">
              <span class="arrow" aria-hidden="true">&rarr;</span><span aria-hidden="true">Volgende</span>
            </button>
          </div>
        </div>
        <div class="sr-only" id="sr-status" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <div id="results">
    <h2>&#127881; Klaar!</h2>
    <div id="result-stars" aria-hidden="true"></div>
    <p id="result-text"></p>
    <p id="result-best"></p>
    <div class="result-actions">
      <button class="menu-btn cap" onclick="startQuiz(mode)">&#128257; Nog een keer</button>
      <button class="menu-btn prov" onclick="goMenu()">Terug naar menu</button>
    </div>
  </div>
</div>

<script src="map-data.js"></script>
<script>
// =====================================================
//  DATA
// =====================================================
const provinces = [
  { id: 'groningen',     name: 'Groningen',       capital: 'Groningen',         fact: 'In het noordoosten. Hoofdstad is de stad Groningen.' },
  { id: 'friesland',     name: 'Friesland',       capital: 'Leeuwarden',        fact: 'Bekend van het Fries en de Elfstedentocht. Hoofdstad: Leeuwarden.' },
  { id: 'drenthe',       name: 'Drenthe',         capital: 'Assen',             fact: 'Provincie met de meeste hunebedden. Hoofdstad: Assen.' },
  { id: 'overijssel',    name: 'Overijssel',      capital: 'Zwolle',            fact: 'Aan de IJssel. Hoofdstad: Zwolle.' },
  { id: 'flevoland',     name: 'Flevoland',       capital: 'Lelystad',          fact: 'De jongste provincie, drooggelegd uit de Zuiderzee. Hoofdstad: Lelystad.' },
  { id: 'gelderland',    name: 'Gelderland',      capital: 'Arnhem',            fact: 'Grootste provincie qua oppervlakte, met de Veluwe. Hoofdstad: Arnhem.' },
  { id: 'utrecht',       name: 'Utrecht',         capital: 'Utrecht',           fact: 'Klein, midden in Nederland. Hoofdstad heet ook Utrecht.' },
  { id: 'noord-holland', name: 'Noord-Holland',   capital: 'Haarlem',           fact: 'Amsterdam ligt hier, maar Haarlem is de hoofdstad!' },
  { id: 'zuid-holland',  name: 'Zuid-Holland',    capital: 'Den Haag',          fact: 'Met Rotterdam en Den Haag (regeringsstad).' },
  { id: 'zeeland',       name: 'Zeeland',         capital: 'Middelburg',        fact: 'Provincie van eilanden en de Deltawerken. Hoofdstad: Middelburg.' },
  { id: 'noord-brabant', name: 'Noord-Brabant',   capital: "'s-Hertogenbosch",  fact: 'Grote zuidelijke provincie. Hoofdstad: Den Bosch.' },
  { id: 'limburg',       name: 'Limburg',         capital: 'Maastricht',        fact: 'Smalle provincie in het zuidoosten, met heuvels. Hoofdstad: Maastricht.' }
];

const rivers = [
  { id: 'maas',                  name: 'Maas',                  fact: 'Komt uit Frankrijk en België, stroomt door Limburg en langs Brabant.' },
  { id: 'waal',                  name: 'Waal',                  fact: 'De grootste tak van de Rijn, stroomt langs Nijmegen naar het westen.' },
  { id: 'nederrijn',             name: 'Nederrijn',             fact: 'Tak van de Rijn die langs Arnhem stroomt, tot Wijk bij Duurstede.' },
  { id: 'lek',                   name: 'Lek',                   fact: 'Vervolg van de Nederrijn richting Rotterdam.' },
  { id: 'ijssel',                name: 'IJssel',                fact: 'Tak van de Rijn die noordwaarts naar het IJsselmeer stroomt.' },
  { id: 'noordzeekanaal',        name: 'Noordzeekanaal',        lw: 'het', fact: 'Kanaal van Amsterdam naar de Noordzee (IJmuiden).' },
  { id: 'amsterdam-rijnkanaal',  name: 'Amsterdam-Rijnkanaal',  lw: 'het', fact: 'Verbindt Amsterdam met de Lek en de Waal.' },
  { id: 'nieuwe-waterweg',       name: 'Nieuwe Waterweg',       fact: 'Korte verbinding van Rotterdam naar de Noordzee.' }
];

const waters = [
  { id: 'ijsselmeer',     name: 'IJsselmeer',     lw: 'het', fact: 'Groot zoetwatermeer, vroeger de Zuiderzee.' },
  { id: 'markermeer',     name: 'Markermeer',     lw: 'het', fact: 'Meer tussen Noord-Holland en Flevoland.' },
  { id: 'oosterschelde',  name: 'Oosterschelde',  fact: 'Zee-arm in Zeeland, beroemd om de stormvloedkering.' },
  { id: 'westerschelde',  name: 'Westerschelde',  fact: 'Zee-arm in Zeeland, vaarroute naar Antwerpen.' },
  { id: 'waddenzee',      name: 'Waddenzee',      fact: 'Ondiepe zee tussen het vasteland en de Waddeneilanden.' },
  { id: 'noordzee',       name: 'Noordzee',       fact: 'De grote zee aan de westkant en noordkant van Nederland.' },
  { id: 'biesbosch',      name: 'Biesbosch',      fact: 'Bijzonder zoetwatergetijdengebied (Brabant/Zuid-Holland).' }
];

// Per soort vraag: hoe vragen we het, en welk kaartonderdeel hoort erbij
const TYPES = {
  province: {
    list: provinces, answer: it => it.name, target: it => it.id, pick: 'province',
    choiceQ: '\u{1F5FA}\uFE0F Welke provincie is rood gekleurd?',
    pointQ: () => '\u{1F5FA}\uFE0F Waar ligt de provincie',
  },
  capital: {
    list: provinces, answer: it => it.capital, target: it => it.capital, pick: 'city',
    choiceQ: '\u{1F3DB}\uFE0F Wat is de hoofdstad van deze provincie?',
    pointQ: () => '\u{1F3DB}\uFE0F Waar ligt de stad',
  },
  river: {
    list: rivers, answer: it => it.name, target: it => it.id, pick: 'river',
    choiceQ: '\u{1F30A} Welke rivier / welk kanaal is oranje gekleurd?',
    pointQ: it => '\u{1F30A} Waar is ' + (it.lw || 'de'),
  },
  water: {
    list: waters, answer: it => it.name, target: it => it.id, pick: 'water',
    choiceQ: '\u{1F4A7} Welk water is geel gekleurd?',
    pointQ: it => '\u{1F4A7} Waar is ' + (it.lw || 'de'),
  },
};
const TOPIC_TYPES = {
  provinces: ['province'], capitals: ['capital'], rivers: ['river'], waters: ['water'],
  mixed: ['province', 'capital', 'river', 'water'],
};

// =====================================================
//  KAART (SVG) - opgebouwd uit map-data.js
// =====================================================
function buildMap() {
  const D = MAP_DATA;
  const [, , w, h] = D.viewBox.split(' ').map(Number);
  const nameOf = (list, id) => list.find(x => x.id === id).name;
  const seaWaters = ['noordzee', 'waddenzee', 'oosterschelde', 'westerschelde', 'ijsselmeer', 'markermeer'];
  return `
<svg viewBox="${D.viewBox}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kaart van Nederland">
  <defs>
    <clipPath id="map-clip"><rect width="${w}" height="${h}" rx="16"/></clipPath>
    <pattern id="waves" width="26" height="16" patternUnits="userSpaceOnUse">
      <path d="M2 5q2.5-2.5 5 0t5 0M15 13q2.5-2.5 5 0t5 0" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="0.9" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g clip-path="url(#map-clip)">
  <rect class="sea-bg" width="${w}" height="${h}"/>
  <path class="inner-water" d="${D.innerWater}"/>
  ${seaWaters.map(id => `<path class="water" data-id="${id}" data-name="${nameOf(waters, id)}" d="${D.waters[id]}"/>`).join('')}
  <rect class="waves" width="${w}" height="${h}"/>
  <path class="land-halo" d="${D.land}"/>
  <path class="neighbor" d="${D.neighbors}"/>
  <path class="land-shadow" d="${D.land}" transform="translate(0.8 2.2)"/>
  <text class="country-label" x="558" y="615">DUITSLAND</text>
  <text class="country-label" x="210" y="770">BELGI&#203;</text>
  ${provinces.map(p => `<path class="province" data-id="${p.id}" data-name="${p.name}" d="${D.provinces[p.id]}"/>`).join('')}
  <path class="water marsh" data-id="biesbosch" data-name="Biesbosch" d="${D.waters.biesbosch}"/>
  <path class="river-link" d="${D.riverLinks}"/>
  <g>${rivers.map(r => `<path class="river-casing" d="${D.rivers[r.id]}"/>`).join('')}</g>
  ${rivers.map(r => `<g class="river-g" data-id="${r.id}" data-name="${r.name}">
    <path class="river-glow" d="${D.rivers[r.id]}"/>
    <path class="river" d="${D.rivers[r.id]}"/>
    <path class="river-flow" d="${D.rivers[r.id]}"/>
    <path class="river-hit" d="${D.rivers[r.id]}"/></g>`).join('')}
  <g id="fx-layer"></g>
  <g id="cities-group">
    ${provinces.map(p => {
      const [x, y] = D.cities[p.capital];
      return `<g class="city" data-city="${p.capital}" data-name="${p.capital}">
        <circle class="city-hit" cx="${x}" cy="${y}" r="14"/>
        <circle class="city-dot" cx="${x}" cy="${y}" r="5"/>
        <text class="city-label" x="${x + 8}" y="${y + 4}">${p.capital}</text></g>`;
    }).join('')}
  </g>
  </g>
</svg>`;
}

document.getElementById('map-container').innerHTML = buildMap();
const svgEl = document.querySelector('#map-container svg');
const citiesGroup = document.getElementById('cities-group');

// =====================================================
//  STATE
// =====================================================
const STYLE_KEY = 'topo-nl-stijl';
let style = 'kies';
try { if (localStorage.getItem(STYLE_KEY) === 'wijs') style = 'wijs'; } catch {}

let mode = null;
let queue = [];
let wrongQueue = [];
let current = null;
let answered = false;
let scoreGood = 0;
let scoreBad = 0;
let streak = 0;
let totalForRound = 0;

const $ = id => document.getElementById(id);

// =====================================================
//  HELPERS
// =====================================================
function shuffle(arr) {
  arr = arr.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pickWrongAnswers(correct, pool, count) {
  const wrongs = shuffle(pool.filter(x => x !== correct)).slice(0, count);
  return shuffle([correct, ...wrongs]);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const MAP_STATES = ['highlight', 'pick-right', 'pick-wrong', 'reveal'];
function clearMap() {
  svgEl.querySelectorAll('[data-id], .city').forEach(el => el.classList.remove(...MAP_STATES));
  svgEl.classList.remove('pick-province', 'pick-city', 'pick-river', 'pick-water');
  citiesGroup.classList.remove('show-dots', 'show-labels');
  document.getElementById('fx-layer').replaceChildren();
}

function featureEl(type, target) {
  return TYPES[type].pick === 'city'
    ? svgEl.querySelector(`.city[data-city="${CSS.escape(target)}"]`)
    : svgEl.querySelector(`[data-id="${target}"]`);
}

function starsFor(pct) {
  return pct === 100 ? 3 : pct >= 80 ? 2 : pct >= 60 ? 1 : 0;
}
function starsHtml(n) {
  return [0, 1, 2].map(i => `<span class="${i < n ? '' : 'off'}">⭐</span>`).join('');
}

// =====================================================
//  MENU
// =====================================================
function setStyle(s) {
  style = s;
  try { localStorage.setItem(STYLE_KEY, s); } catch {}
  document.querySelectorAll('.style-toggle button').forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.style === s ? 'true' : 'false');
  });
  placeTogglePill();
  $('menu-help').textContent = s === 'kies'
    ? 'Bij elke vraag licht er iets op de kaart op. Kies het juiste antwoord uit vier opties. Fout? Geen probleem, de vraag komt later in dezelfde ronde nog een keer terug!'
    : 'Je krijgt een naam en tikt op de juiste plek op de kaart. Fout? Dan zie je waar het wel ligt, en de vraag komt later in dezelfde ronde nog een keer terug!';
  renderBestScores();
}

function placeTogglePill() {
  const btn = document.querySelector('.style-toggle button[aria-pressed="true"]');
  const toggle = btn.parentElement;
  if (!btn.offsetWidth) return;
  toggle.style.setProperty('--pill-x', btn.offsetLeft + 'px');
  toggle.style.setProperty('--pill-w', btn.offsetWidth + 'px');
  requestAnimationFrame(() => toggle.classList.remove('no-anim'));
}
window.addEventListener('resize', placeTogglePill);
document.fonts.ready.then(placeTogglePill);

// =====================================================
//  QUIZ FLOW
// =====================================================
function startQuiz(m) {
  mode = m;
  scoreGood = 0;
  scoreBad = 0;
  streak = 0;
  lastPct = 0;
  wrongQueue = [];
  queue = shuffle(TOPIC_TYPES[m].flatMap(type => TYPES[type].list.map(item => ({ type, item }))));
  totalForRound = queue.length;

  $('menu').style.display = 'none';
  $('results').style.display = 'none';
  $('quiz').classList.add('active');
  $('quiz').classList.toggle('point', style === 'wijs');
  $('app').classList.add('in-quiz');
  updateStreak();
  nextQuestion();
}

function nextQuestion() {
  $('quiz').classList.remove('answered');
  $('feedback').className = 'feedback';
  $('feedback').textContent = '';

  if (queue.length === 0) {
    if (wrongQueue.length > 0) {
      queue = shuffle(wrongQueue);
      wrongQueue = [];
      showToast('\u{1F501} Nu nog een keer de foute vragen!');
    } else {
      return endQuiz();
    }
  }

  current = queue.shift();
  answered = false;
  updateScore();
  clearMap();
  if (style === 'wijs') renderPointQuestion();
  else renderChoiceQuestion();
}

function renderChoiceQuestion() {
  const T = TYPES[current.type];
  const it = current.item;
  $('question-text').innerHTML = `<span class="q-anim">${escapeHtml(T.choiceQ)}</span>`;
  svgEl.querySelector(`[data-id="${it.id}"]`).classList.add('highlight');

  const aEl = $('answers');
  aEl.innerHTML = '';
  const correct = T.answer(it);
  pickWrongAnswers(correct, T.list.map(T.answer), 3).forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.dataset.value = opt;
    btn.innerHTML = `<span class="key" aria-hidden="true">${i + 1}</span>${escapeHtml(opt)}`;
    btn.onclick = () => handleChoice(opt, correct);
    aEl.appendChild(btn);
  });
}

function renderPointQuestion() {
  const T = TYPES[current.type];
  const name = T.answer(current.item);
  $('question-text').innerHTML = `<span class="q-anim">${T.pointQ(current.item)} <span class="target">${escapeHtml(name)}</span>?</span>`;
  $('answers').innerHTML = '';
  svgEl.classList.add('pick-' + T.pick);
  if (T.pick === 'city') citiesGroup.classList.add('show-dots');
}

function handleChoice(chosen, correct) {
  if (answered) return;
  answered = true;
  const ok = chosen === correct;

  // Bij hoofdsteden: toon nu alle steden + licht de juiste op
  if (current.type === 'capital') {
    citiesGroup.classList.add('show-dots', 'show-labels');
    featureEl('capital', correct).classList.add('highlight');
  }
  finishAnswer(ok, `Jij koos ${escapeHtml(chosen)}. Het is <b>${escapeHtml(correct)}</b>.`);
}

function handleMapPick(e) {
  if (style !== 'wijs' || answered || !current || !$('quiz').classList.contains('active')) return;
  const T = TYPES[current.type];
  const el = T.pick === 'river' || T.pick === 'city'
    ? nearestFeature(T.pick, e)
    : e.target.closest(T.pick === 'province' ? '.province' : '.water');
  if (!el) return;
  answered = true;

  const target = T.target(current.item);
  const chosen = T.pick === 'city' ? el.dataset.city : el.dataset.id;
  const ok = chosen === target;
  svgEl.classList.remove('pick-' + T.pick);

  const tap = svgPoint(e);
  fxRipple(tap, !ok);
  let extra = '';
  if (ok) {
    el.classList.add('pick-right');
    fxSparks(tap);
  } else {
    el.classList.add('pick-wrong');
    const right = featureEl(current.type, target);
    right.classList.add('reveal');
    fxRing(right);
    extra = `Dat is ${escapeHtml(el.dataset.name)} (rood). `
      + `<b>${escapeHtml(T.answer(current.item))}</b> is groen.`;
  }
  if (T.pick === 'city') citiesGroup.classList.add('show-labels');
  finishAnswer(ok, extra);
}
svgEl.addEventListener('click', handleMapPick);

// =====================================================
//  KAARTEFFECTEN
// =====================================================
const SVG_NS = 'http://www.w3.org/2000/svg';
const fxLayer = document.getElementById('fx-layer');
const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function svgPoint(e) {
  return new DOMPoint(e.clientX, e.clientY).matrixTransform(svgEl.getScreenCTM().inverse());
}
function fxAdd(tag, attrs, life) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  fxLayer.appendChild(el);
  setTimeout(() => el.remove(), life);
  return el;
}
function fxRipple(pt, bad) {
  if (reduceMotion()) return;
  fxAdd('circle', { class: 'fx fx-ripple' + (bad ? ' bad' : ''), cx: pt.x, cy: pt.y, r: 18 }, 500);
}
function fxSparks(pt) {
  if (reduceMotion()) return;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + Math.random() * 0.4;
    const d = 22 + Math.random() * 14;
    const spark = fxAdd('circle', { class: 'fx fx-spark', cx: pt.x, cy: pt.y, r: 2.6 + Math.random() * 1.6 }, 600);
    spark.style.setProperty('--dx', (Math.cos(a) * d).toFixed(1) + 'px');
    spark.style.setProperty('--dy', (Math.sin(a) * d).toFixed(1) + 'px');
  }
}
// Ring rond het juiste antwoord: "hier ligt het"
function fxRing(el) {
  if (reduceMotion()) return;
  const b = el.getBBox();
  const r = Math.max(14, Math.min(60, Math.max(b.width, b.height) / 2 + 6));
  fxAdd('circle', { class: 'fx fx-ring', cx: b.x + b.width / 2, cy: b.y + b.height / 2, r }, 3400);
}

// Rivieren en steden zijn klein: kies de dichtstbijzijnde binnen een ruime marge
const PICK_RADIUS = { river: 22, city: 26 };
let riverSamples = null;
function nearestFeature(pick, e) {
  const pt = svgPoint(e);
  let best = null, bestD = PICK_RADIUS[pick];
  if (pick === 'city') {
    svgEl.querySelectorAll('.city').forEach(g => {
      const c = g.querySelector('.city-dot');
      const d = Math.hypot(c.cx.baseVal.value - pt.x, c.cy.baseVal.value - pt.y);
      if (d < bestD) { bestD = d; best = g; }
    });
    return best;
  }
  if (!riverSamples) {
    riverSamples = [...svgEl.querySelectorAll('.river-g')].map(g => {
      const path = g.querySelector('.river');
      const len = path.getTotalLength();
      const pts = [];
      for (let l = 0; l <= len; l += 2) pts.push(path.getPointAtLength(l));
      return { g, pts };
    });
  }
  for (const { g, pts } of riverSamples) {
    for (const p of pts) {
      const d = Math.hypot(p.x - pt.x, p.y - pt.y);
      if (d < bestD) { bestD = d; best = g; }
    }
  }
  return best;
}

function finishAnswer(ok, extraHtml) {
  const feedback = $('feedback');
  const fact = escapeHtml(current.item.fact);
  if (ok) {
    scoreGood++;
    streak++;
    feedback.className = 'feedback good';
    let html = '<span class="mark">\u2705</span> <b>Goed zo!</b> ' + fact;
    if (streak >= 5 && streak % 5 === 0) {
      html += ` <span class="streak-note">\u{1F525} Al ${streak} goed op rij!</span>`;
    }
    feedback.innerHTML = `<div>${html}</div>`;
  } else {
    scoreBad++;
    streak = 0;
    wrongQueue.push(current);
    feedback.className = 'feedback bad';
    feedback.innerHTML = `<div><span class="mark">\u274C</span> ${extraHtml} ${fact}</div>`;
  }
  $('sr-status').textContent = feedback.textContent;

  updateScore();
  updateStreak();
  $('quiz').classList.add('answered');
  $('next-btn').focus({ preventScroll: true });
}

let toastTimer = null;
function showToast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

function setCount(id, value) {
  const el = $(id);
  const changed = el.textContent !== String(value);
  el.textContent = value;
  if (changed && answered) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
}

let lastPct = 0;
function updateScore() {
  const left = queue.length + wrongQueue.length;
  setCount('score-good', scoreGood);
  setCount('score-bad', scoreBad);
  $('score-left').textContent = left;
  // Voortgang = aantal onderdelen dat al goed is beantwoord
  const remaining = left + (answered ? 0 : 1);
  const pct = totalForRound ? Math.round(((totalForRound - remaining) / totalForRound) * 100) : 0;
  const fill = $('progress-fill');
  fill.style.width = pct + '%';
  if (pct > lastPct) {
    fill.classList.remove('shine');
    void fill.offsetWidth;
    fill.classList.add('shine');
  }
  lastPct = pct;
  document.querySelector('.progress').setAttribute('aria-valuenow', pct);
}

function updateStreak() {
  const el = $('streak');
  const show = streak >= 3;
  if (show) el.innerHTML = `\u{1F525} ${streak}<span class="lbl"> op rij</span>`;
  if (show !== el.classList.contains('show')) el.classList.toggle('show', show);
}

function endQuiz() {
  $('quiz').classList.remove('active');
  $('app').classList.remove('in-quiz');
  $('results').style.display = 'block';
  const total = scoreGood + scoreBad;
  const pct = total > 0 ? Math.round((scoreGood / total) * 100) : 0;

  let msg;
  if (pct === 100) msg = '\u{1F3C6} Geweldig! Alles in een keer goed!';
  else if (pct >= 80) msg = '\u{1F31F} Heel goed! ' + scoreGood + ' van de ' + total + ' goed.';
  else if (pct >= 60) msg = '\u{1F44D} Goed gedaan! ' + scoreGood + ' van de ' + total + ' goed.';
  else msg = '\u{1F4AA} Blijf oefenen! ' + scoreGood + ' van de ' + total + ' goed.';
  $('result-text').textContent = msg;
  $('result-stars').innerHTML = starsHtml(starsFor(pct));

  const best = saveBestScore(scoreKey(mode), pct);
  $('result-best').textContent = best.isNew
    ? '\u{1F389} Nieuwe topscore voor dit onderwerp: ' + pct + '%!'
    : 'Beste score voor dit onderwerp: ' + best.value + '%';

  if (pct === 100) launchConfetti();
}

function goMenu() {
  clearMap();
  current = null;
  $('quiz').classList.remove('active');
  $('app').classList.remove('in-quiz');
  $('results').style.display = 'none';
  $('menu').style.display = 'block';
  renderBestScores();
}

// =====================================================
//  CONFETTI
// =====================================================
function launchConfetti() {
  if (reduceMotion()) return;
  const box = document.createElement('div');
  box.className = 'confetti';
  document.body.appendChild(box);
  const colors = ['#b7472a', '#f9a620', '#4a7c59', '#3a6b6e', '#ffd54f', '#6b9b78', '#e8816a'];
  const H = window.innerHeight, W = window.innerWidth;
  for (let i = 0; i < 110; i++) {
    const c = document.createElement('i');
    if (i % 3 === 0) c.className = 'round';
    c.style.background = colors[i % colors.length];
    box.appendChild(c);
    // Uitbarsting omhoog, daarna vallen met zwaartekracht en wat wiebelen
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.9;
    const speed = (0.55 + Math.random() * 0.6) * Math.min(W, 700);
    const vx = Math.cos(angle) * speed, vy = Math.sin(angle) * speed;
    const g = H * 1.6, spin = (Math.random() - 0.5) * 1440, sway = 20 + Math.random() * 30;
    const dur = 2200 + Math.random() * 1400;
    const frames = [];
    for (let k = 0; k <= 12; k++) {
      const t = (k / 12) * (dur / 1000);
      const x = vx * t * 0.55 + Math.sin(t * 6 + i) * sway;
      const y = vy * t + 0.5 * g * t * t;
      frames.push({
        transform: `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(spin * k / 12).toFixed(0)}deg) rotateX(${(k * 70) % 360}deg)`,
        opacity: k > 9 ? 1 - (k - 9) / 3 : 1,
      });
    }
    c.animate(frames, { duration: dur, delay: Math.random() * 150, easing: 'linear', fill: 'both' });
  }
  setTimeout(() => box.remove(), 4000);
}

// =====================================================
//  TOETSENBORD: 1-4 kiest een antwoord, Enter/spatie = volgende
// =====================================================
document.addEventListener('keydown', e => {
  if (!$('quiz').classList.contains('active') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[1-4]$/.test(e.key) && !answered) {
    const btn = document.querySelectorAll('.answer-btn')[Number(e.key) - 1];
    if (btn) { e.preventDefault(); btn.click(); }
  } else if ((e.key === 'Enter' || e.key === ' ') && answered) {
    // Een gefocuste knop handelt Enter/spatie zelf al af
    if (e.target.tagName === 'BUTTON') return;
    e.preventDefault();
    nextQuestion();
  }
});

// =====================================================
//  BESTE SCORES (localStorage)
// =====================================================
const STORAGE_KEY = 'topo-nl-best-scores-v1';
const scoreKey = m => style === 'wijs' ? m + ':wijs' : m;

function loadBestScores() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch { return {}; }
}

function saveBestScore(key, pct) {
  const scores = loadBestScores();
  const prev = scores[key];
  if (prev === undefined || pct > prev) {
    scores[key] = pct;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(scores)); } catch {}
    return { value: pct, isNew: true };
  }
  return { value: prev, isNew: false };
}

function renderBestScores() {
  const scores = loadBestScores();
  for (const m of Object.keys(TOPIC_TYPES)) {
    const el = $('best-' + m);
    const v = scores[scoreKey(m)];
    el.innerHTML = v !== undefined
      ? `<span class="stars" aria-hidden="true">${starsHtml(starsFor(v))}</span> Beste: ${v}%`
      : '';
  }
}

function resetScores() {
  if (confirm('Weet je zeker dat je alle beste scores wilt wissen?')) {
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
    renderBestScores();
  }
}

setStyle(style);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
